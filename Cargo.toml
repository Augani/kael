[workspace]
resolver = "2"
members = [
    "crates/kael",
    "crates/kael-media",
    "crates/kael-macros",
    "crates/kael_storage",
    "crates/kael_icons",
    "crates/kael_diagnostics",
    "crates/kael_document",
    "crates/kael_audio",
    "crates/kael_pdf",
    "crates/kael_notifications",
    "crates/kael_share",
    "crates/kael_cache",
    "crates/kael_i18n",
    "crates/kael_net",
    "crates/kael_release",
    "crates/kael_secrets",
    "crates/kael_render_graph",
    "crates/kael_gpu_budget",
    "crates/kael_engines",
    "crates/kael_ui",
    "crates/collections",
    "crates/derive_refineable",
    "crates/http_client",
    "crates/media",
    "crates/perf",
    "crates/refineable",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/semantic_version",
    "xtask",
    "templates/messaging",
    "templates/workspace",
    "templates/dashboard",
