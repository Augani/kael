[workspace]
resolver = "2"
members = [
    "crates/kael",
    "crates/kael-cli",
    "crates/kael-media",
    "crates/kael-macros",
    "crates/kael_storage",
    "crates/kael_icons",
    "crates/kael_diagnostics",
    "crates/kael_document",
    "crates/kael_audio",
    "crates/kael_pdf",
    "crates/kael_office",
    "crates/kael_notifications",
    "crates/kael_markdown",
    "crates/kael_share",
    "crates/kael_cache",
    "crates/kael_i18n",
    "crates/kael_net",
    "crates/kael_release",
    "crates/kael_secrets",
    "crates/kael_render_graph",
    "crates/kael_gpu_budget",
    "crates/kael_engines",
    "crates/kael_media_engines",
    "crates/kael_ui",
    "crates/collections",
    "crates/derive_refineable",
    "crates/http_client",
    "crates/media",
    "crates/perf",
    "crates/refineable",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/semantic_version",
    "xtask",
    "templates/messaging",
    "templates/workspace",
    "templates/dashboard",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["Augustus Otu"]
license = "Apache-2.0"
repository = "https://github.com/Augani/kael"
homepage = "https://augani.github.io/kael/"

[workspace.dependencies]
anyhow = "1.0.86"
futures = "0.3"
log = "0.4.16"
serde = "1.0.221"
serde_json = "1.0.144"
smallvec = "1.6"
smol = "2.0"
thiserror = "2.0.12"
unicode-segmentation = "1.10"
windows = "0.62"

# Release builds trade compile time for runtime and download performance. Keep
# debug/dev profiles fast; shipped native binaries and Wasm receive whole-graph
# optimization while preserving symbols for Kael diagnostics and crash reports.
[profile.release]
codegen-units = 1
lto = "fat"

[workspace.lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.lints.clippy.style]
level = "allow"
priority = -1

[workspace.lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
