[workspace]
resolver = "2"
members = [
    "crates/kael",
    "crates/kael-cli",
    "crates/kael-media",
    "crates/kael-macros",
    "crates/kael_storage",
    "crates/kael_icons",
    "crates/kael_diagnostics",
    "crates/kael_document",
    "crates/kael_audio",
    "crates/kael_pdf",
    "crates/kael_notifications",
    "crates/kael_share",
    "crates/kael_cache",
    "crates/kael_i18n",
    "crates/kael_net",
    "crates/kael_release",
    "crates/kael_secrets",
    "crates/kael_render_graph",
    "crates/kael_gpu_budget",
    "crates/kael_engines",
    "crates/kael_media_engines",
    "crates/kael_ui",
    "crates/collections",
    "crates/derive_refineable",
    "crates/http_client",
    "crates/media",
    "crates/perf",
    "crates/refineable",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/semantic_version",
    "xtask",
    "templates/messaging",
    "templates/workspace",
    "templates/dashboard",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
authors = ["Augustus Otu"]
license = "Apache-2.0"
repository = "https://github.com/Augani/kael"
homepage = "https://augani.github.io/kael/"

[workspace.dependencies]
anyhow = "1.0.86"
futures = "0.3"
log = "0.4.16"
serde = "1.0.221"
serde_json = "1.0.144"
smallvec = "1.6"
smol = "2.0"
thiserror = "2.0.12"
unicode-segmentation = "1.10"
windows = "0.62"
