[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
