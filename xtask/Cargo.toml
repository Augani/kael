[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
kael_release = { path = "../crates/kael_release" }

[dev-dependencies]
tempfile = "3"
