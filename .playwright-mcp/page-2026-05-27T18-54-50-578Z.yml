            - generic [ref=e186]: fn main
            - text: "() { Application::new().run(|cx: &mut App| { let bounds = Bounds::centered(None, size(px(400.0), px(300.0)), cx); cx.open_window( WindowOptions { window_bounds: Some(WindowBounds::Windowed(bounds)), ..Default::default() }, |_, cx| cx.new(|_| Counter { count: 0 }), ).unwrap(); cx.activate(true); }); }"
