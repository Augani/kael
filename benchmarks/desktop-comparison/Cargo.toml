[package]
name = "kael-desktop-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "component_comparison"
path = "src/component_comparison.rs"

[[bin]]
name = "data_comparison"
path = "src/data_comparison.rs"

[[bin]]
name = "tree_comparison"
path = "src/tree_comparison.rs"

[[bin]]
name = "workspace_comparison"
path = "src/workspace_comparison.rs"

[workspace]

[features]
default = ["kael-engine", "frame-timing"]
kael-engine = ["dep:kael", "dep:kael_ui"]
gpui-kit-engine = ["dep:gpui-kit"]
frame-timing = ["kael?/inspector", "gpui-kit?/profiler"]

[dependencies]
kael = { path = "../../crates/kael", optional = true, features = ["runtime_shaders"] }
kael_ui = { path = "../../crates/kael_ui", optional = true }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", rev = "3467e647600290343885b500bd7464057e334d18", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[profile.release]
codegen-units = 1
lto = "fat"
