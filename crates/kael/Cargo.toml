[package]
edition.workspace = true
name = "kael"
rust-version.workspace = true
version.workspace = true
authors.workspace = true
build = "build.rs"
publish = true
description = "GPU-accelerated native UI framework for Rust — build desktop apps with Metal, DirectX, and Vulkan rendering"
homepage.workspace = true
readme = "README.md"
keywords = [
    "gui",
    "desktop",
    "gpu",
    "ui-framework",
    "native",
]
categories = ["gui", "rendering::graphics-api"]
license.workspace = true
repository.workspace = true
exclude = [
    "benches/",
    "examples/",
]

[features]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
inspector = ["kael_macros/inspector"]
leak-detection = ["backtrace"]
macos-blade = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "objc2-metal",
]
runtime_shaders = []
media = ["kael_media"]
storage = ["dep:kael_storage"]
icons = ["dep:kael_icons"]
diagnostics = ["dep:kael_diagnostics"]
document = ["dep:kael_document"]
audio = ["dep:kael_audio"]
pdf = ["dep:kael_pdf"]
notifications-full = ["dep:kael_notifications"]
share = ["dep:kael_share"]
platform-foundation = [
    "storage",
    "icons",
    "diagnostics",
]
screen-capture = ["scap"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "rand",
    "util/test-support",
    "http_client/test-support",
]
# Enables a real Linux windowing backend (Wayland + X11) alongside test-support.
# `test-support` itself is headless and platform-agnostic: the TestPlatform mocks
# the windowing layer, so macOS/Windows test builds no longer pull the Linux
# windowing crates. Linux CI that exercises real-window rendering under tests can
# opt in with `--features test-support,test-support-linux-windowing`.
test-support-linux-windowing = ["test-support", "wayland", "x11"]
wayland = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "ashpd/wayland",
    "cosmic-text",
    "font-kit",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "filedescriptor",
    "xkbcommon",
    "open",
]
windows-manifest = []
x11 = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "ashpd",
    "cosmic-text",
    "font-kit",
    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    "scap?/x11",
]

[lib]
name = "kael"
path = "src/kael.rs"
doctest = false

[[bin]]
name = "kael-worker-child"
path = "tests/fixtures/worker_child.rs"

[[bin]]
name = "kael-extension-child"
path = "tests/fixtures/extension_child.rs"


[[test]]
name = "action_macros"
path = "tests/action_macros.rs"

