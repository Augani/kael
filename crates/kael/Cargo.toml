[package]
edition.workspace = true
name = "kael"
autoexamples = false
rust-version.workspace = true
version.workspace = true
authors.workspace = true
build = "build.rs"
publish = true
description = "Resource-efficient Rust application framework with retained GPU UI for desktop and WebAssembly"
documentation = "https://docs.rs/kael"
homepage.workspace = true
readme = "README.md"
keywords = [
    "gui",
    "desktop",
    "gpu",
    "ui-framework",
    "wasm",
]
categories = ["gui", "rendering::graphics-api"]
license.workspace = true
repository.workspace = true
exclude = [
    "benchmark-results.json",
    "benches/",
    "docs/",
    "examples/",
]

[package.metadata.docs.rs]
features = [
    "agent-tools",
    "auto-update",
    "http-client",
    "image-avif",
    "image-exr",
    "icons",
    "lottie",
    "runtime_shaders",
]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "webview_smoke"
path = "examples/webview_smoke.rs"
required-features = ["webview"]

[[example]]
name = "webview_gtk4_platform_smoke"
path = "examples/webview_gtk4_platform_smoke.rs"
required-features = ["webview-wayland-gtk4"]

[[example]]
name = "webview_wayland_gtk4_smoke"
path = "examples/webview_wayland_gtk4_smoke.rs"
required-features = ["webview-wayland-gtk4"]

[[example]]
name = "scene_graph_move_query_probe"
path = "examples/scene_graph_move_query_probe.rs"

[[example]]
name = "native_pointer_lock_smoke"
path = "examples/native_pointer_lock_smoke.rs"

[[example]]
name = "native_renderer_smoke"
path = "examples/native_renderer_smoke.rs"
required-features = ["font-kit"]

[features]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
browser = [
    "dep:cosmic-text",
    "dep:ttf-parser",
    "uuid/js",
]
# Product batteries whose public graphs are kept build-portable across native
# and browser targets. Runtime availability remains explicit through Kael's
# capability reports (for example native installers and OS signal capture are
# intentionally unavailable inside the browser sandbox).
portable-services = [
    "agent-tools",
    "auto-update",
    "inspector",
    "lottie",
    "runtime_shaders",
    "http-client",
    "webview",
    "devtools",
    "media",
    "storage",
    "icons",
    "diagnostics",
    "document",
    "audio",
    "pdf",
    "office",
    "notifications-full",
    "share",
    "image-avif",
    "image-exr",
    "screen-capture",
    "game-input",
]
# Convenient maximum browser consumer graph for suite-class applications.
browser-full = ["browser", "portable-services"]
agent-tools = []
auto-update = [
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:kael_release",
    "dep:sha2",
]
inspector = ["kael_macros/inspector"]
leak-detection = ["backtrace"]
lottie = ["dep:rasterlottie"]
macos-blade = [
    "dep:blade-graphics",
    "dep:blade-macros",
    "dep:blade-util",
    "dep:bytemuck",
    "objc2-metal",
]
runtime_shaders = []
http-client = ["http_client/reqwest"]
webview = [
    "dep:webview2-com",
    "dep:windows-core-webview2",
    "dep:wry",
    "webview-wayland-gtk4",
]
# Maintained Linux production host for native Wayland, X11, and XWayland. GTK
# owns the top-level surface; Kael's retained scene is presented through GSK
# and WebKitGTK 6 views are native siblings in the same widget hierarchy. The
# portable `webview` feature selects this implementation on Linux.
webview-wayland-gtk4 = [
    "dep:gdk4-x11",
    "dep:gdk4-wayland",
    "dep:gtk4",
    "dep:webkit6",
    "linux-platform",
    "linux-wayland-protocols",
    "linux-x11-protocols",
]
# Platform-neutral name for new applications. The old feature stays as the
# implementation feature and compatibility spelling so existing manifests do
# not need to change.
webview-gtk4 = ["webview-wayland-gtk4"]
# Deprecated pre-release compatibility spelling. It resolves to the maintained
# GTK4/WebKitGTK 6 host so no manifest can opt back into the archived GTK3 ABI.
webview-legacy-gtk3 = ["webview-wayland-gtk4"]
devtools = ["wry?/devtools"]
media = ["dep:kael_media", "kael_media/native-media"]
storage = ["dep:kael_storage"]
icons = ["dep:kael_icons"]
diagnostics = ["dep:kael_diagnostics"]
document = ["dep:kael_document"]
audio = ["dep:kael_audio"]
pdf = ["dep:kael_pdf"]
office = ["dep:kael_office"]
notifications-full = ["dep:kael_notifications"]
share = ["dep:kael_share"]
# `kael-media` owns the target-specific codec edge so native builds enable image's dav1d-backed
# decoder without adding dav1d to wasm32 dependency graphs.
image-avif = ["dep:kael_media", "kael_media/image-avif-native"]
image-exr = ["image/exr"]
platform-foundation = [
    "storage",
    "icons",
    "diagnostics",
]
screen-capture = ["scap"]
# Native controller discovery/state through gilrs. Browser builds use the
# platform Gamepad API directly, while retaining the same public Window API.
game-input = ["dep:gilrs"]
font-kit = ["dep:font-kit"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "rand",
    "util/test-support",
    "http_client/test-support",
]
# Enables a real Linux windowing backend (Wayland + X11) alongside test-support.
# `test-support` itself is headless and platform-agnostic: the TestPlatform mocks
# the windowing layer, so macOS/Windows test builds no longer pull the Linux
# windowing crates. Linux CI that exercises real-window rendering under tests can
# opt in with `--features test-support,test-support-linux-windowing`.
test-support-linux-windowing = ["test-support", "wayland", "x11"]
linux-platform = [
    "dep:ashpd",
    "dep:cosmic-text",
    "dep:filedescriptor",
    "font-kit",
    "dep:open",
    "dep:xkbcommon",
]
linux-wayland-protocols = [
    "ashpd/wayland",
    "dep:wayland-backend",
    "dep:wayland-client",
    "dep:wayland-protocols",
]
linux-x11-protocols = ["dep:x11rb"]
wayland = [
    "linux-platform",
    "linux-wayland-protocols",
    "dep:blade-graphics",
    "dep:blade-macros",
    "dep:blade-util",
    "dep:bytemuck",
    "calloop-wayland-source",
    "wayland-cursor",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
]
windows-manifest = []
x11 = [
    "linux-platform",
    "linux-x11-protocols",
    "dep:blade-graphics",
    "dep:blade-macros",
    "dep:blade-util",
    "dep:bytemuck",
    "as-raw-xcb-connection",
    "xim",
    "x11-clipboard",
    "scap?/x11",
]

[lib]
name = "kael"
path = "src/kael.rs"
doctest = false

[[bin]]
name = "kael-worker-child"
path = "tests/fixtures/worker_child.rs"

[[bin]]
name = "kael-extension-child"
path = "tests/fixtures/extension_child.rs"

[[bench]]
name = "framework"
path = "benches/framework.rs"
harness = false

[[test]]
name = "action_macros"
path = "tests/action_macros.rs"

