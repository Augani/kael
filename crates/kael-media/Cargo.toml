[package]
edition = "2024"
name = "kael-media"
version = "0.5.1"
publish = true
description = "Audio playback primitives for GPUI"
authors = ["Adabraka Team"]
repository = "https://github.com/Augani/kael"
readme = false
license = "Apache-2.0"

[lib]
name = "kael_media"
path = "src/lib.rs"
doctest = false

[dependencies.ffmpeg-next]
version = "8.1.0"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.rodio]
version = "0.20"

[dependencies.thiserror]
version = "2.0.12"

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
