[package]
edition.workspace = true
name = "kael-media"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
autoexamples = false
description = "Bounded audio playback and incremental video decoding primitives for Kael"
documentation = "https://docs.rs/kael-media"
exclude = ["examples/**"]
keywords = ["media", "audio", "playback", "kael"]
categories = ["multimedia::audio", "multimedia::video", "multimedia"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lib]
name = "kael_media"
path = "src/lib.rs"

[features]
default = ["native-media"]
native-media = [
    "dep:ffmpeg-next",
    "dep:parking_lot",
    "dep:rodio",
    "dep:url",
]
# This feature is a target-aware bridge for Kael's native AVIF decoder. The optional dependency is
# absent on wasm32, where Rust-side AVIF raster decoding remains explicitly unsupported.
image-avif-native = ["dep:image"]

[dependencies.thiserror]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ffmpeg-next]
version = "8.1.0"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.image]
version = "0.25.1"
default-features = false
features = ["avif-native"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.parking_lot]
version = "0.12.1"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rodio]
version = "0.20"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.url]
version = "2.5"
optional = true

[lints]
workspace = true
