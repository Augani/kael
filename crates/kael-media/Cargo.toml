[package]
edition.workspace = true
name = "kael-media"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
autoexamples = false
description = "Bounded audio playback and incremental video decoding primitives for Kael"
documentation = "https://docs.rs/kael-media"
exclude = ["examples/**"]
keywords = ["media", "audio", "playback", "kael"]
categories = ["multimedia::audio", "multimedia::video", "multimedia"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lib]
name = "kael_media"
path = "src/lib.rs"

[dependencies.ffmpeg-next]
version = "8.1.0"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.rodio]
version = "0.20"

[dependencies.thiserror]
workspace = true

[dependencies.url]
version = "2.5"

[lints]
workspace = true
