[package]
edition.workspace = true
name = "kael_gpu_budget"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Cross-platform GPU memory budget query (Metal / DXGI / Vulkan) for Kael"
keywords = ["gpu", "memory", "vram", "kael"]
categories = ["rendering::graphics-api"]
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"

[lib]
name = "kael_gpu_budget"
path = "src/lib.rs"
doctest = false

[target.'cfg(target_os = "macos")'.dependencies.metal]
version = "0.29"

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[target.'cfg(target_os = "linux")'.dependencies.ash]
version = "0.38"

[lints]
workspace = true
