[dependencies.serde_json]
workspace = true

[dependencies.smol]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.futures]
workspace = true

[lints]
workspace = true
