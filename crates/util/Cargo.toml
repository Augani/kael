[package]
edition.workspace = true
name = "kael_util"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "A collection of utility structs and functions for Kael"
keywords = ["utilities", "helpers", "kael"]
categories = ["development-tools"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[package.metadata.docs.rs]
features = ["archive", "schema"]

[features]
archive = ["dep:async_zip", "dep:tempfile"]
schema = ["dep:schemars"]
test-support = [
    "dep:git2",
    "dep:rand",
    "dep:tempfile",
    "dep:util_macros",
]

[lib]
name = "kael_util"
path = "src/util.rs"
doctest = true

[dependencies.anyhow]
workspace = true

[dependencies.async-fs]
version = "2.1"

[dependencies.async_zip]
version = "0.0.17"
optional = true
features = [
    "deflate",
    "deflate64",
]

[dependencies.collections]
path = "../collections"
package = "kael_collections"
version = "0.3.1"

[dependencies.dirs]
version = "4.0"

[dependencies.dunce]
version = "1.0"

[dependencies.futures]
workspace = true

[dependencies.futures-lite]
version = "2.6"

[dependencies.git2]
version = "0.21"
optional = true
default-features = false

[dependencies.globset]
version = "0.4"

[dependencies.itertools]
version = "0.14.0"

[dependencies.log]
workspace = true
features = [
    "kv_unstable_serde",
    "serde",
]

[dependencies.rand]
version = "0.9"
optional = true

[dependencies.regex]
version = "1.5"

[dependencies.rust-embed]
version = "8.4"
features = ["include-exclude"]

[dependencies.schemars]
version = "1.0"
optional = true
features = ["indexmap2"]

[dependencies.serde]
workspace = true
features = [
    "derive",
    "rc",
]

[dependencies.serde_json]
workspace = true
features = [
    "preserve_order",
    "raw_value",
]

[dependencies.serde_json_lenient]
version = "0.2"
features = [
    "preserve_order",
    "raw_value",
]

[dependencies.shlex]
version = "1.3.0"

[dependencies.smol]
workspace = true

[dependencies.take-until]
version = "0.2.0"

[dependencies.tempfile]
version = "3.20.0"
optional = true

[dependencies.unicase]
version = "2.6"

[dependencies.util_macros]
path = "../util_macros"
optional = true
package = "kael_util_macros"
version = "0.3.1"

[dependencies.which]
version = "6.0.0"


[dev-dependencies.git2]
version = "0.21"
default-features = false

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.rand]
version = "0.9"

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.util_macros]
path = "../util_macros"
package = "kael_util_macros"
version = "0.3.1"

[dev-dependencies.walkdir]
version = "2.5"

[target."cfg(unix)".dependencies.command-fds]
version = "0.3.1"

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(unix)".dependencies.nix]
version = "0.29"
features = ["user"]

[target."cfg(windows)".dependencies.tendril]
version = "0.4.3"

[lints]
workspace = true
