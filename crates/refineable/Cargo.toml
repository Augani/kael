[package]
edition.workspace = true
name = "kael_refineable"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "A macro for creating refinement types for Kael"
keywords = ["refineable", "style", "patterns", "kael"]
categories = ["rust-patterns"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[lib]
name = "kael_refineable"
path = "src/refineable.rs"
doctest = false

[dependencies.derive_refineable]
path = "../derive_refineable"
package = "kael_derive_refineable"
version = "0.3.0"


[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
