[package]
edition = "2024"
name = "kael_refineable"
version = "0.1.0"
publish = true
description = "A macro for creating refinement types for Kael"
authors = ["Adabraka Team"]
repository = "https://github.com/Augani/kael"
readme = false
license = "Apache-2.0"

[lib]
name = "kael_refineable"
path = "src/refineable.rs"
doctest = false

[dependencies.derive_refineable]
path = "../derive_refineable"
package = "kael_derive_refineable"
version = "0.1.0"


[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
