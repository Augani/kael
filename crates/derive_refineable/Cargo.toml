[package]
edition.workspace = true
name = "kael_derive_refineable"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "A derive macro for creating refinement types in Rust for Kael"
keywords = ["derive", "macros", "refineable", "kael"]
categories = ["development-tools::procedural-macro-helpers", "rust-patterns"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[lib]
name = "kael_derive_refineable"
path = "src/derive_refineable.rs"
doctest = false
proc-macro = true

[dependencies.proc-macro2]
version = "1.0.93"

[dependencies.quote]
version = "1.0.9"

[dependencies.syn]
version = "2.0.101"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]


[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
