[package]
edition = "2024"
name = "kael_audio"
version = "0.5.1"
publish = true
description = "Audio playback services for Kael"
authors = ["Adabraka Team"]
repository = "https://github.com/Augani/kael"
readme = false
license = "Apache-2.0"

[lib]
name = "kael_audio"
path = "src/lib.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.kael_media]
path = "../kael-media"
package = "kael-media"
version = "0.5.1"

[dependencies.parking_lot]
version = "0.12.1"

[dev-dependencies.futures]
version = "0.3"

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0