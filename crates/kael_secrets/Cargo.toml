[package]
edition.workspace = true
name = "kael_secrets"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Secure OS-keychain credential storage for Kael"
keywords = ["keychain", "secrets", "credentials", "kael"]
categories = ["os", "authentication"]
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "kael_secrets"
path = "src/lib.rs"
doctest = false

[dependencies.anyhow]
workspace = true

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.zeroize]
version = "1.8"
features = ["alloc"]

[target.'cfg(target_os = "macos")'.dependencies.security-framework]
version = "3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
]

[target.'cfg(target_os = "linux")'.dependencies.secret-service]
version = "4"
features = ["rt-async-io-crypto-rust"]

[lints]
workspace = true
