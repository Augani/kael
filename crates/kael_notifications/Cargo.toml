[package]
edition.workspace = true
name = "kael_notifications"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Notification services for Kael"
keywords = ["notifications", "desktop", "native", "kael"]
categories = ["os", "gui"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[lib]
name = "kael_notifications"
path = "src/lib.rs"

[dependencies.anyhow]
workspace = true

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.thiserror]
workspace = true

[dev-dependencies.futures]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.zbus]
version = "5.18"
default-features = false
features = ["async-io", "blocking-api"]

[target.'cfg(target_os = "macos")'.dependencies.mac-notification-sys]
version = "0.6.15"

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "=0.2.122"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Event",
    "EventTarget",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "Window",
]

[lints]
workspace = true
