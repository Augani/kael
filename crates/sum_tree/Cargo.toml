[package]
edition.workspace = true
name = "kael_sum_tree"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "A sum tree data structure, a concurrency-friendly B-tree for Kael"
keywords = ["b-tree", "sumtree", "data-structures", "kael"]
