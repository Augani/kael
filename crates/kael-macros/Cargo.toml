[package]
edition.workspace = true
name = "kael-macros"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Macros for Kael"
keywords = ["macros", "derive", "gui", "kael", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "gui"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[features]
inspector = []

[lib]
name = "kael_macros"
path = "src/kael_macros.rs"
doctest = true
proc-macro = true

[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"

[[test]]
name = "derive_context"
path = "tests/derive_context.rs"

[[test]]
name = "derive_inspector_reflection"
path = "tests/derive_inspector_reflection.rs"

[[test]]
name = "render_test"
path = "tests/render_test.rs"

[dependencies.heck]
version = "0.5"

[dependencies.proc-macro2]
version = "1.0.93"

[dependencies.proc-macro-crate]
version = "3.5.0"

[dependencies.quote]
version = "1.0.9"

[dependencies.syn]
version = "2.0.101"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]


[dev-dependencies]
kael_renamed = { package = "kael", path = "../kael", features = ["runtime_shaders", "test-support"] }
trybuild = "1"

[lints]
workspace = true
