[package]
edition.workspace = true
name = "kael_pdf"
autoexamples = false
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Bounded PDF parsing, text search, links, metadata, and sidecar annotations for Kael"
documentation = "https://docs.rs/kael_pdf"
keywords = ["pdf", "document", "annotations", "kael"]
categories = ["multimedia"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
exclude = ["examples/"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "kael_pdf"
path = "src/lib.rs"

[dependencies.anyhow]
workspace = true

[dependencies.lopdf]
version = "0.44"
default-features = false

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
workspace = true

[dependencies.sha2]
version = "0.10"

[dependencies.smol]
workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Storage_FileSystem"]

[dev-dependencies.futures]
workspace = true

[dev-dependencies.tempfile]
version = "3.20.0"

[lints]
workspace = true
