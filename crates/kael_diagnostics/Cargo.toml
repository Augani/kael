[package]
edition.workspace = true
name = "kael_diagnostics"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Platform services diagnostics scaffolding for Kael"
keywords = ["diagnostics", "errors", "logging", "kael"]
categories = ["development-tools::debugging"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[lib]
name = "kael_diagnostics"
path = "src/lib.rs"
doctest = false

[features]
# Builds the crash_helper test binary. Off by default so the published crate
# ships only the library; the native_crash integration test enables it.
_crash_test_helper = []

[[bin]]
name = "crash_helper"
path = "src/bin/crash_helper.rs"
required-features = ["_crash_test_helper"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.http_client]
path = "../http_client"
package = "kael_http_client"
version = "0.3.0"

[dependencies.serde]
version = "1.0.221"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.144"

[target.'cfg(unix)'.dependencies.libc]
version = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_Security",
]

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.pollster]
version = "0.2"

[target.'cfg(unix)'.dev-dependencies.libc]
version = "0.2"

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
