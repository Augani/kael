[package]
edition.workspace = true
name = "kael_document"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Cross-platform document persistence, recovery, undo history, versions, and byte import/export for Kael"
keywords = ["document", "versioning", "storage", "kael"]
categories = ["text-processing", "data-structures"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[lib]
name = "kael_document"
path = "src/lib.rs"

[dependencies.anyhow]
workspace = true

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
workspace = true

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies.smol]
workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.kael_storage]
path = "../kael_storage"
package = "kael_storage"
version = "0.4.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.js-sys]
version = "0.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.async-lock]
version = "3.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Storage_FileSystem"]

[dev-dependencies.futures]
workspace = true

[dev-dependencies.tempfile]
version = "3.20.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true
