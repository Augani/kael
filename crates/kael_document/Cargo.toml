[package]
edition.workspace = true
name = "kael_document"
rust-version.workspace = true
homepage.workspace = true
version.workspace = true
publish = true
description = "Atomic document persistence, recovery, undo history, versions, and recents for Kael"
keywords = ["document", "versioning", "storage", "kael"]
categories = ["text-processing", "data-structures"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true

[lib]
name = "kael_document"
path = "src/lib.rs"

[dependencies.anyhow]
workspace = true

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
workspace = true

[dependencies.sha2]
version = "0.10"

[dependencies.smol]
workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Storage_FileSystem"]

[dev-dependencies.futures]
workspace = true

[dev-dependencies.tempfile]
version = "3.20.0"

[lints]
workspace = true
