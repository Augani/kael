# DIAGNOSTIC BRANCH ONLY. This deliberately uses the existing workflow filename
# in an isolated managed worktree/branch. Do not replace the main PR workflow.
name: Isolated Metal Presentation Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal-presentation-control:
    name: Independent AppKit / MTKView presentation control
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute bounded independent controls
        env:
          METAL_CONTROL_EVIDENCE: target/metal-presentation-control
        run: python3 diagnostics/metal-presentation/run-controls.py
      - name: Upload raw environment and presentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independent-metal-presentation-control
          path: target/metal-presentation-control
          if-no-files-found: error
