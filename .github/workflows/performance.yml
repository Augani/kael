name: Cross-platform Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  KAEL_HEADLESS: 1

jobs:
  benchmark:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/install-linux-deps.sh

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-24
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download the main-branch baseline
        id: download-baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmarks/baselines
          if gh api repos/${{ github.repository }}/contents/benchmarks/baselines/kael-messaging-baseline.json?ref=main > baseline_info.json 2>/dev/null; then
            download_url=$(jq -r '.download_url // empty' baseline_info.json)
            if [ -n "$download_url" ]; then
              curl -sL "$download_url" -o benchmarks/baselines/kael-messaging-baseline.json
              echo "baseline_found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "baseline_found=false" >> "$GITHUB_OUTPUT"

      - name: Run the framework benchmark
        shell: bash
        run: |
          if [ "${{ steps.download-baseline.outputs.baseline_found }}" == "true" ]; then
            cargo bench -p kael --bench framework -- --compare
          else
            cargo bench -p kael --bench framework
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmark-results.json
          if-no-files-found: error
