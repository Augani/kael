name: Cross-platform Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  KAEL_HEADLESS: 1

jobs:
  desktop-comparison:
    name: Matched Kael / GPUI Kit desktop workload
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install matched compiler
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-24
        with:
          toolchain: 1.97.1

      - name: Install measurement Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: benchmarks/desktop-comparison

      - name: Build pinned competitor and local framework
        shell: bash
        run: |
          set -o pipefail
          python benchmarks/desktop-comparison/test_measure.py
          mkdir -p .artifacts/competition/binaries
          cargo build --manifest-path benchmarks/desktop-comparison/Cargo.toml --locked \
            --release --no-default-features --features gpui-kit-engine,frame-timing \
            2>&1 | tee .artifacts/competition/gpui-kit-build.log
          cp benchmarks/desktop-comparison/target/release/kael-desktop-comparison \
            .artifacts/competition/binaries/gpui-kit
          cp benchmarks/desktop-comparison/target/release/component_comparison \
            .artifacts/competition/binaries/gpui-kit-editor
          cp benchmarks/desktop-comparison/target/release/data_comparison \
            .artifacts/competition/binaries/gpui-kit-data
          cp benchmarks/desktop-comparison/target/release/tree_comparison \
            .artifacts/competition/binaries/gpui-kit-tree
          cp benchmarks/desktop-comparison/target/release/workspace_comparison \
            .artifacts/competition/binaries/gpui-kit-workspace
          cargo build --manifest-path benchmarks/desktop-comparison/Cargo.toml --locked \
            --release --no-default-features --features kael-engine,frame-timing \
            2>&1 | tee .artifacts/competition/kael-build.log
          cp benchmarks/desktop-comparison/target/release/kael-desktop-comparison \
            .artifacts/competition/binaries/kael
          cp benchmarks/desktop-comparison/target/release/component_comparison \
            .artifacts/competition/binaries/kael-editor
          cp benchmarks/desktop-comparison/target/release/data_comparison \
            .artifacts/competition/binaries/kael-data
          cp benchmarks/desktop-comparison/target/release/tree_comparison \
            .artifacts/competition/binaries/kael-tree
          cp benchmarks/desktop-comparison/target/release/workspace_comparison \
            .artifacts/competition/binaries/kael-workspace
          cargo build --manifest-path benchmarks/desktop-comparison/Cargo.toml --locked \
            --release --no-default-features --features gpui-kit-engine \
            2>&1 | tee .artifacts/competition/gpui-kit-without-frame-timing-build.log
          cp benchmarks/desktop-comparison/target/release/kael-desktop-comparison \
            .artifacts/competition/binaries/gpui-kit-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/component_comparison \
            .artifacts/competition/binaries/gpui-kit-editor-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/data_comparison \
            .artifacts/competition/binaries/gpui-kit-data-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/tree_comparison \
            .artifacts/competition/binaries/gpui-kit-tree-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/workspace_comparison \
            .artifacts/competition/binaries/gpui-kit-workspace-without-frame-timing
          cargo build --manifest-path benchmarks/desktop-comparison/Cargo.toml --locked \
            --release --no-default-features --features kael-engine \
            2>&1 | tee .artifacts/competition/kael-without-frame-timing-build.log
          cp benchmarks/desktop-comparison/target/release/kael-desktop-comparison \
            .artifacts/competition/binaries/kael-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/component_comparison \
            .artifacts/competition/binaries/kael-editor-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/data_comparison \
            .artifacts/competition/binaries/kael-data-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/tree_comparison \
            .artifacts/competition/binaries/kael-tree-without-frame-timing
          cp benchmarks/desktop-comparison/target/release/workspace_comparison \
            .artifacts/competition/binaries/kael-workspace-without-frame-timing

      - name: Collect five alternating native runs per engine
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          unset KAEL_HEADLESS
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael \
            --gpui-kit .artifacts/competition/binaries/gpui-kit \
            --output .artifacts/competition/native-navigation-detail --repetitions 5 \
            2>&1 | tee .artifacts/competition/measurement.log

      - name: Measure framework frame instrumentation overhead
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          unset KAEL_HEADLESS
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-without-frame-timing \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-without-frame-timing \
            --output .artifacts/competition/navigation-detail-without-frame-timing \
            --without-frame-timing --repetitions 5 \
            2>&1 | tee .artifacts/competition/without-frame-timing-measurement.log

      - name: Compare actual Unicode editor workflows
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          unset KAEL_HEADLESS
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-editor \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-editor \
            --contract native-editor-document-v1 \
            --output .artifacts/competition/native-editor-document --repetitions 5 \
            2>&1 | tee .artifacts/competition/editor-measurement.log
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-editor-without-frame-timing \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-editor-without-frame-timing \
            --contract native-editor-document-v1 --without-frame-timing \
            --output .artifacts/competition/editor-document-without-frame-timing --repetitions 5 \
            2>&1 | tee .artifacts/competition/editor-without-frame-timing-measurement.log

      - name: Compare actual 100,000-row data controls
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          unset KAEL_HEADLESS
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-data \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-data \
            --contract native-data-table-v1 \
            --output .artifacts/competition/native-data-table --repetitions 5 \
            2>&1 | tee .artifacts/competition/data-measurement.log
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-data-without-frame-timing \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-data-without-frame-timing \
            --contract native-data-table-v1 --without-frame-timing \
            --output .artifacts/competition/data-table-without-frame-timing --repetitions 5 \
            2>&1 | tee .artifacts/competition/data-without-frame-timing-measurement.log

      - name: Compare 100,025-node native virtual trees
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          unset KAEL_HEADLESS
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-tree \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-tree \
            --contract native-virtual-tree-v1 \
            --output .artifacts/competition/native-virtual-tree --repetitions 5 \
            2>&1 | tee .artifacts/competition/tree-measurement.log
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-tree-without-frame-timing \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-tree-without-frame-timing \
            --contract native-virtual-tree-v1 --without-frame-timing \
            --output .artifacts/competition/native-virtual-tree-without-frame-timing --repetitions 5 \
            2>&1 | tee .artifacts/competition/tree-without-frame-timing-measurement.log

      - name: Compare persistent native dock workspaces
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          unset KAEL_HEADLESS
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-workspace \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-workspace \
            --contract native-dock-workspace-v1 \
            --output .artifacts/competition/native-dock-workspace --repetitions 5 \
            2>&1 | tee .artifacts/competition/workspace-measurement.log
          python benchmarks/desktop-comparison/measure.py \
            --kael .artifacts/competition/binaries/kael-workspace-without-frame-timing \
            --gpui-kit .artifacts/competition/binaries/gpui-kit-workspace-without-frame-timing \
            --contract native-dock-workspace-v1 --without-frame-timing \
            --output .artifacts/competition/native-dock-workspace-without-frame-timing --repetitions 5 \
            2>&1 | tee .artifacts/competition/workspace-without-frame-timing-measurement.log

      - name: Preserve raw comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-kael-gpui-kit-comparison
          path: |
            .artifacts/competition/*.log
            .artifacts/competition/native-navigation-detail
            .artifacts/competition/navigation-detail-without-frame-timing
            .artifacts/competition/native-editor-document
            .artifacts/competition/editor-document-without-frame-timing
            .artifacts/competition/native-data-table
            .artifacts/competition/data-table-without-frame-timing
            .artifacts/competition/native-virtual-tree
            .artifacts/competition/native-virtual-tree-without-frame-timing
            .artifacts/competition/native-dock-workspace
            .artifacts/competition/native-dock-workspace-without-frame-timing
          if-no-files-found: error

  benchmark:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/install-linux-deps.sh

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-24
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download the main-branch baseline
        id: download-baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmarks/baselines
          if gh api repos/${{ github.repository }}/contents/benchmarks/baselines/kael-messaging-baseline.json?ref=main > baseline_info.json 2>/dev/null; then
            download_url=$(jq -r '.download_url // empty' baseline_info.json)
            if [ -n "$download_url" ]; then
              curl -sL "$download_url" -o benchmarks/baselines/kael-messaging-baseline.json
              echo "baseline_found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "baseline_found=false" >> "$GITHUB_OUTPUT"

      - name: Run the framework benchmark
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          metadata = {
              "source_commit": command("git", "rev-parse", "HEAD"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "platform": platform.platform(),
              "processor": platform.processor(),
              "cpu_count": os.cpu_count(),
              "rustc": command("rustc", "-Vv"),
              "framework_scope": "Headless synthetic scene construction/batching; Metal may use offscreen GPU readback. No native application input, drawable presentation, idle power or desktop workflow measurement.",
              "resource_scope": "CPU transient allocation planning and GPU budget bookkeeping. Excludes driver allocations and native application behavior.",
          }
          Path("benchmark-environment.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          if [ "${{ steps.download-baseline.outputs.baseline_found }}" == "true" ]; then
            cargo bench -p kael --bench framework -- --compare
          else
            cargo bench -p kael --bench framework
          fi

      - name: Run resource-planning benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo bench --locked -p kael_render_graph --bench transient_allocation 2>&1 | tee transient-allocation.log
          cargo bench --locked -p kael --bench gpu_budget 2>&1 | tee gpu-budget.log

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            benchmark-results.json
            benchmark-environment.json
            transient-allocation.log
            gpu-budget.log
          if-no-files-found: error
