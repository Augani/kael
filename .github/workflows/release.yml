name: Publish crates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated workspace to crates.io
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: bash scripts/ci/install-linux-deps.sh

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Refuse publishing outside main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "Publishing is only allowed from refs/heads/main; got $GITHUB_REF" >&2
          exit 1

      - name: Strict workspace lint
        run: >-
          cargo clippy --workspace --all-targets
          --all-features
          -- -D warnings

      - name: Workspace tests
        run: >-
          cargo test --workspace --all-targets
          --all-features

      - name: Package audit
        run: bash scripts/publish-all.sh --preflight

  publish:
    name: Publish to crates.io
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: bash scripts/ci/install-linux-deps.sh

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          KAEL_PUBLISH_CONFIRM: publish-kael-0.3.1
          KAEL_PUBLISH_REF: ${{ github.ref }}
        run: bash scripts/publish-all.sh --execute
