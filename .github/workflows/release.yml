name: Publish crates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the already validated main-branch SHA to crates.io
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  attest:
    name: Attest exact-SHA readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      readiness_url: ${{ steps.readiness.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse publishing outside main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "Publishing is only allowed from refs/heads/main; got $GITHUB_REF" >&2
          exit 1

      - name: Resolve immutable candidate
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a successful exact-SHA Platform Readiness run
        id: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/platform-readiness.yml/runs?head_sha=${CANDIDATE_SHA}&status=success&per_page=20")
          run_url=$(jq -r \
            --arg sha "${CANDIDATE_SHA}" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].html_url // empty' \
            <<< "${response}")
          if [ -z "${run_url}" ]; then
            echo "No successful Platform Readiness run exists for ${CANDIDATE_SHA}." >&2
            echo "Push the candidate and wait for that exact SHA to pass before publishing." >&2
            exit 1
          fi
          echo "url=${run_url}" >> "$GITHUB_OUTPUT"
          echo "Validated ${CANDIDATE_SHA} with ${run_url}"

  publish:
    name: Publish to crates.io
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.attest.outputs.candidate_sha }}

      - name: Install Linux dependencies
        run: bash scripts/ci/install-linux-deps.sh

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-24
        with:
          toolchain: 1.97.1

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          KAEL_PUBLISH_REF: refs/heads/main
        run: |
          package_version="$(cargo pkgid -p kael | sed -E 's/.*[@#]//')"
          export KAEL_PUBLISH_CONFIRM="publish-kael-${package_version}"
          bash scripts/publish-all.sh --execute
